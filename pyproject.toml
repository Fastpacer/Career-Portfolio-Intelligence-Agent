[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent"
version = "0.2.0"
description = "AI career analysis from a CV, GitHub portfolio and target role"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7,<2",
    "requests>=2.32,<3",
    "pdfplumber>=0.11,<0.12",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "loguru>=0.7,<0.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
ui = [
    "streamlit>=1.40,<2",
]
dev = [
    "career-agent[api,ui]",
    "pytest>=8,<10",
    "responses>=0.25,<1",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "pre-commit>=3,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["career_agent", "api"]
